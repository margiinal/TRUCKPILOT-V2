<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 480" role="img" aria-labelledby="title desc">
<title id="title">MYTRUCK MATE — Le compagnon du chauffeur</title>
<desc id="desc">Bandeau bleu nuit et orange avec le logo de l’application, un camion sur la route et un port en arrière-plan.</desc>
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#03101f"/><stop offset=".48" stop-color="#0b2941"/><stop offset=".78" stop-color="#ef6c24"/><stop offset="1" stop-color="#ffb34c"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#19364a"/><stop offset="1" stop-color="#020914"/></linearGradient>
 <linearGradient id="truck" x2="1" y2="1"><stop stop-color="#e9f5ff"/><stop offset=".38" stop-color="#5f8ba8"/><stop offset="1" stop-color="#071c30"/></linearGradient>
 <linearGradient id="orange" x2="1"><stop stop-color="#ffcc57"/><stop offset="1" stop-color="#ff7918"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="shade" x2="1"><stop stop-color="#020b17" stop-opacity=".12"/><stop offset=".56" stop-color="#020b17" stop-opacity=".08"/><stop offset="1" stop-color="#020b17" stop-opacity=".35"/></linearGradient>
</defs>
